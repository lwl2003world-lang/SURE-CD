config_tag: gaussian_nuisance_levir
seed: 42
devices: "auto"
res_path: "./results"

wandb_proj: None
vis_path: False
save_ckpt: True

eval_only: False
ckpt_path: null  # Independent evaluation loads train.ckpt_dir/<seed>/best_weights.ckpt if present, else weights.ckpt.

dev: False

data:
  dataset: "LEVIR"
  img_size: 256
  num_workers: 4
  batch_size: 4
  pin_memory: True
  data_path: "E:/expcd/datasets"
  use_hf: False
  bands: "rgb"

train:
  ckpt_dir: "checkpoints/mechanism/gaussian_nuisance/LEVIR"
  use: True
  strategy:
    class_path: models.train_strats.cross_donor_pt.CrossDonorPT
    init_args:
      q_dim: C
      change_noise_q: 0.98
      change_noise_type: NORMAL
      change_stat_source: FEAT
      base_noise_q: 0.90
      base_noise_type: NORMAL
      overlap_base: True
      donor_prob: 0.8
      alpha_min: 0.50
      alpha_max: 0.85
      box_mask_prob: 0.3
      spatial_blur_prob: 0.8
      spatial_blur_sigma: 1.5
      spatial_alpha: 0.5

  epochs: -1
  steps: 3500
  val_freq: 200
  base_lr: 1.0e-5
  weight_decay: 1.0e-4
  grad_clip_val: 1
  lr_scheduler:
    type: "cosine"
    ratio_t0: 1
  loss:
    - dice
    - ce
  transforms:
    - VerticalFlip: { p: 0.3 }
    - HorizontalFlip: { p: 0.3 }
    - Rotate: { limit: [ -90, 90 ], p: 0.3 }
    - Normalize: { mean: [ 0.485, 0.456, 0.406 ], std: [ 0.229, 0.224, 0.225 ] }

encoder:
  class_path: models.modules.hf_backbone.HFBackbone
  init_args:
    model_name: "weights/dinov3"
    return_layers: [7, 11, 15, 23]
    train_args:
      pretrained: True
      finetune: False

diff:
  class_path: models.modules.simple_diff.SubDiff

decoder:
  train:
    class_path: models.modules.upernet.UperNetHead
    init_args:
      out_channels: 1
      hidden_size: 512
      use_auxfcn: False
      weight_decay: 0.05
      drop_cls_on_transfer: False
